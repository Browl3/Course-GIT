<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista tabelas e formularios </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <table class="tabela-compras"> 
        <thead>
            <tr>
                <th>ITEM</th>
                <th>Quantidade</th>
                <th>Preço unitário</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arroz</td>
                <td>2</td>
                <td>R$ 5,50</td>
                <td>R$ 11,00</td> <!-- Corrigido o cálculo de 2 x 5,50 -->
            </tr>
        </tbody>
 
        <tbody>
            <tr>
                <td>Feijao</td>
                <td>1</td>
                <td>R$ 7,50</td>
                <td>R$ 7,50</td> <!-- Corrigido o cálculo de 2 x 5,50 -->
            </tr>
        </tbody>
    
        <tbody>
            <tr>
                <td>Leite</td>
                <td>3</td>
                <td>R$ 4,50</td>
                <td>R$ 12,60</td> <!-- Corrigido o cálculo de 2 x 5,50 -->
            </tr>
        </tbody>

        <tfoot>
            <tr> 
                <td colspan="3">TOTAL</td>
                <td>R$ 30,10</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
